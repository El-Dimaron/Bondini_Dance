{% extends "base.html" %}

{% block title %}Головна — MyShop{% endblock %}

{% block content %}

    <!-- Hero Banner -->
    <section class="hero">
        <div class="container">
            <h1>Нова Колекція 2025</h1>
            <p><a href="#" class="btn btn-light btn-lg mt-3">Переглянути зараз</a></p>
        </div>
    </section>

    <!-- Products -->
    <section class="py-5">
        <div class="container">
            <h2 class="text-center mb-4"></h2>
            <div class="row g-4">
                {% for item in items %}
                    <div class="col-md-4">
                        <div class="card product-card h-100 shadow-sm border-0">
                            <img src="{{ item.image.url }}" class="card-img-top" alt="{{ item.name }}">
                            <div class="card-body d-flex flex-column justify-content-between text-center">
                                <h5 class="card-title">{{ item.name }}</h5>
                                <p class="text-muted">{{ item.price }}</p>
                                <a href="#" class="btn btn-dark btn-sm mt-auto">Купити</a>
                            </div>
                        </div>
                    </div>

                {% endfor %}
            </div>
        </div>
    </section>

{% endblock %}
