{% extends "home.html" %}
{% load crispy_forms_tags %}

{% block title %}Оформлення замовлення{% endblock %}

{% block content %}

    <div class="container py-5">
        <div class="text-center">
            <h2>Оформлення замовлення</h2>
            <form method="post" enctype='multipart/form-data' class="mx-auto mt-4" style="max-width: 25em;">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-dark mt-3">Підтвердити замовлення</button>
            </form>
        </div>
    </div>

{% endblock %}
