services:
  backend:
    build: ./
    container_name: bd_server_container
    working_dir: /bd_server
    ports:
      - 8000:8015
    env_file:
      - .env
    environment:
      DOCKER: "1"
    command:
      - ./commands/start_server_${MODE}.sh
    volumes:
      - ./src:/bd_server/src
      - ./commands:/bd_server/commands
      - ./src/static:/bd_server/src/static
      - ./src/media:/bd_server/src/media
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

  postgres:
    image: postgres:17.5
    ports:
      - 5432:5432
    env_file:
      - .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_container
    restart: on-failure
    env_file:
      - .env
    ports:
      - 5001:80
    volumes:
      - pg_admin:/var/lib/pgadmin
    depends_on:
      - postgres

  mongo:
    image: mongo:7.0
    container_name: mongo_container
    ports:
      - 27017:27017
    env_file:
      - .env
    volumes:
      - mongo_data:/data/db
    restart: on-failure
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mongoadmin:
    image: mongo-express
    restart: on-failure
    container_name: mongo_admin_container
    ports:
      - 8081:8081
    env_file:
      - .env
    links:
      - mongo
    depends_on:
      - mongo

  nginx:
    image: nginx:1.19
    volumes:
      - ./src/static:/bd_server/src/static
      - ./src/media:/bd_server/src/media
      - ./nginx:/etc/nginx/conf.d
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    depends_on:
      - backend

volumes:
  pg_data: { }
  pg_admin: { }
  mongo_data: { }
